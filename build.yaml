project: freertos-workspace

platforms:
  aarch64-qemu-virt:
    arch: aarch64
    machine: qemu-virt
    cpu: cortex-a53

targets:
  arch_api:
    build:
      type: static_library
      includes:
        - arch/include
      sources:
        c:
          - arch/aarch64/arch.c

  freertos_smp:
    build:
      type: kernel_image
      depends:
        - arch_api
      includes:
        - include
        - kernel/include
        - kernel/portable/GCC/ARM_AARCH64_SRE
        - bsp/include
      sources:
        c:
          - kernel/*.c
          - kernel/port/*.c
          - bsp/src/*.c
        asm:
          - kernel/port/*.S
          - bsp/src/*.S

  lk_smp:
    build:
      type: kernel_image
      depends:
        - arch_api
      includes:
        - lk/include
        - lk/kernel/include
        - lk/arch/arm64/include
        - lk/platform/include
      sources:
        c:
          - lk/kernel/**/*.c
          - lk/arch/arm64/**/*.c
          - lk/platform/qemu-virt-arm/**/*.c
          - lk/app/*.c
        asm:
          - lk/arch/arm64/*.S
          - lk/platform/qemu-virt-arm/**/*.S

  threadx_smp:
    build:
      type: kernel_image
      depends:
        - arch_api
      external_root: /mnt/d/workspace/luna-workspace/other-os/threadx-master
      includes:
        - threadx/port
        - /mnt/d/workspace/luna-workspace/other-os/threadx-master/include
        - /mnt/d/workspace/luna-workspace/other-os/threadx-master/arch/aarch64/include
      sources:
        c:
          - threadx/app/*.c
          - threadx/port/*.c
          - /mnt/d/workspace/luna-workspace/other-os/threadx-master/kernel/smp/*.c
          - /mnt/d/workspace/luna-workspace/other-os/threadx-master/kernel/*.c
          - /mnt/d/workspace/luna-workspace/other-os/threadx-master/arch/aarch64/**/*.c
        asm:
          - /mnt/d/workspace/luna-workspace/other-os/threadx-master/arch/aarch64/*.S
          - /mnt/d/workspace/luna-workspace/other-os/threadx-master/arch/aarch64/kernel/*.S

test_matrix:
  scheduler:
    modes:
      - full
      - cross
    kernels:
      - freertos_smp
      - lk_smp
      - threadx_smp
