<svg xmlns="http://www.w3.org/2000/svg" width="960" height="170" viewBox="0 0 960 170" role="img" aria-label="启动流程">
<title>启动流程</title>

<style>
  .bg { fill:#ffffff }
  text { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#1f2328 }
  .h  { font-size:14px; font-weight:600 }
  .b  { font-size:12.5px }
  .s  { font-size:11.5px; fill:#59636e }
  .m  { font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace; font-size:11.5px; fill:#59636e }
  .tag { font-size:11px; font-weight:600; fill:#59636e; letter-spacing:.04em }
  .layer { fill:#f6f8fa; stroke:#d1d9e0; stroke-width:1 }
  .dash  { fill:none; stroke:#d1d9e0; stroke-width:1; stroke-dasharray:4 3 }
  .app  { fill:#dafbe1; stroke:#4ac26b }
  .ker  { fill:#ddf4ff; stroke:#54aeff }
  .vir  { fill:#fbefff; stroke:#c297ff }
  .hw   { fill:#fff8c5; stroke:#d4a72c }
  .dat  { fill:#ffffff; stroke:#afb8c1 }
  .acc  { fill:#0969da; stroke:#0969da }
  .acct { fill:#ffffff; font-size:12.5px; font-weight:600 }
  .ln   { fill:none; stroke:#6e7781; stroke-width:1.3 }
  .lnd  { fill:none; stroke:#6e7781; stroke-width:1.3; stroke-dasharray:5 4 }
  .ah   { fill:#6e7781 }
  @media (prefers-color-scheme: dark) {
    .bg { fill:#0d1117 }
    text { fill:#e6edf3 }
    .s, .m, .tag { fill:#9198a1 }
    .layer { fill:#151b23; stroke:#3d444d }
    .dash  { stroke:#3d444d }
    .app { fill:#0f2d1a; stroke:#2ea043 }
    .ker { fill:#0c2d4a; stroke:#388bfd }
    .vir { fill:#2a1740; stroke:#a371f7 }
    .hw  { fill:#2e2405; stroke:#bb8009 }
    .dat { fill:#0d1117; stroke:#3d444d }
    .acc { fill:#1f6feb; stroke:#1f6feb }
    .ln, .lnd { stroke:#8b949e }
    .ah { fill:#8b949e }
  }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path class="ah" d="M0,0 L10,5 L0,10 z"/>
  </marker>
</defs>

<rect class="bg" x="0" y="0" width="960" height="170"/>
<rect class="ker" x="28" y="40" width="140" height="92" rx="8"/>
<text class="h" x="98.0" y="74.5" text-anchor="middle">startup.S</text>
<text class="s" x="98.0" y="92.5" text-anchor="middle">EL2 → EL1</text>
<text class="s" x="98.0" y="108.5" text-anchor="middle">栈 · BSS · 向量表</text>
<rect class="ker" x="180" y="40" width="140" height="92" rx="8"/>
<text class="h" x="250.0" y="74.5" text-anchor="middle">ukernel_start</text>
<text class="s" x="250.0" y="92.5" text-anchor="middle">串口 · GICv3</text>
<text class="s" x="250.0" y="108.5" text-anchor="middle">定时器 · 创建任务</text>
<path class="ln" d="M168,86 L179,86" marker-end="url(#a)"/>
<rect class="ker" x="332" y="40" width="140" height="92" rx="8"/>
<text class="h" x="402.0" y="74.5" text-anchor="middle">FreeRTOS 调度</text>
<text class="s" x="402.0" y="92.5" text-anchor="middle">主核开始调度</text>
<text class="s" x="402.0" y="108.5" text-anchor="middle">启动监控任务</text>
<path class="ln" d="M320,86 L331,86" marker-end="url(#a)"/>
<rect class="ker" x="484" y="40" width="140" height="92" rx="8"/>
<text class="h" x="554.0" y="74.5" text-anchor="middle">PSCI CPU_ON</text>
<text class="s" x="554.0" y="92.5" text-anchor="middle">监控任务</text>
<text class="s" x="554.0" y="108.5" text-anchor="middle">拉起从核</text>
<path class="ln" d="M472,86 L483,86" marker-end="url(#a)"/>
<rect class="app" x="636" y="40" width="140" height="92" rx="8"/>
<text class="h" x="706.0" y="74.5" text-anchor="middle">验收探针</text>
<text class="s" x="706.0" y="92.5" text-anchor="middle">监控任务与</text>
<text class="s" x="706.0" y="108.5" text-anchor="middle">固定核 worker</text>
<path class="ln" d="M624,86 L635,86" marker-end="url(#a)"/>
<rect class="app" x="788" y="40" width="140" height="92" rx="8"/>
<text class="h" x="858.0" y="74.5" text-anchor="middle">[sched-verify]</text>
<text class="s" x="858.0" y="92.5" text-anchor="middle">监控任务周期</text>
<text class="s" x="858.0" y="108.5" text-anchor="middle">汇总并打印</text>
<path class="ln" d="M776,86 L787,86" marker-end="url(#a)"/>
</svg>
